<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seagrass Mapping Survey</title>
  <meta name="description" content="Offline participatory mapping survey of seagrass benefits.">
  <meta name="theme-color" content="#176399">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Seagrass Survey">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="header-row">
      <div class="brand">
        <strong>Seagrass Mapping Survey</strong>
        <span id="header-info"></span>
      </div>
      <div class="header-actions">
        <span id="save-indicator" class="save-indicator" aria-live="polite"></span>
        <button type="button" id="data-button" class="btn small">Data &amp; export</button>
      </div>
    </div>
    <nav id="section-nav" class="section-nav" aria-label="Survey sections"></nav>
  </header>
  <div id="banners" class="banners" aria-live="polite"></div>
  <main id="main">
    <noscript>This survey needs JavaScript enabled.</noscript>
    <p class="caption">Loading…</p>
  </main>
  <footer class="app-footer">
    All questions are optional. Responses are anonymous and stored only on this device until exported.
    <span id="version"></span>
  </footer>
</body>
</html>
